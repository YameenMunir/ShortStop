    <script src="../harness.js"></script>
    <script src="../../extension/content/instagram.js"></script>
  </head>
  <body>
    <div class="app">
      <!-- Instagram's navigation lives outside <main>, so it stays usable. -->
      <nav>
        <a href="/" data-name="Home link" data-expect="visible">Home</a>
        <a href="#" role="link" data-name="Search button" data-expect="visible"><svg aria-label="Search" width="10" height="10"></svg>Search</a>
        <a href="/explore/" data-name="Explore link" data-expect="visible">Explore</a>
        <a href="/reels/" data-name="Reels link" data-expect="hidden">Reels</a>
        <a href="/direct/inbox/" data-name="Messages link" data-expect="visible">Messages</a>
        <a href="#" role="link" data-name="Notifications button" data-expect="hidden" data-expect-notifallowed="visible">
          <svg aria-label="Notifications" width="10" height="10"></svg>Notifications
        </a>
        <a href="/accounts/activity/" data-name="Notifications link (mobile)" data-expect="hidden" data-expect-notifallowed="visible">Activity</a>
        <a href="#" role="link" data-name="Create button" data-expect="visible"><svg aria-label="New post" width="10" height="10"></svg>Create</a>
        <a href="/me_user/" data-name="Own profile link" data-expect="visible"><img alt="me_user's profile picture" width="10" height="10" />Profile</a>
      </nav>

      <main data-name="content area">
        <!-- Home: stories tray, feed and suggestions. All of it sits behind the panel. -->
        <div data-name="stories tray" data-expect="hidden" data-expect-modereels="visible">
          <a href="/stories/natgeo/1/"><img alt="natgeo's profile picture" width="10" height="10" /></a>
        </div>
        <article data-name="feed photo post" data-expect="hidden" data-expect-modereels="visible"><a href="/p/PHOTO111111/"><time>2h</time></a></article>
        <article data-name="feed reel post" data-expect="hidden" data-expect-modereels="hidden"><a href="/reel/REEL1111111/"><time>3h</time></a></article>
        <video data-name="autoplaying feed video" muted></video>

        <!-- Profile page -->
        <header data-name="profile header" data-expect-profile="visible" data-expect-modereelsprofile="visible">
          <h2>natgeo</h2>
          <button>Follow</button><button>Message</button>
        </header>
        <div data-name="suggested accounts block" data-expect-profile="hidden" data-expect-post="hidden" data-expect-modereelsprofile="visible">
          <div><span>Suggested for you</span><a href="/explore/people/">See all</a></div>
          <ul>
            <li><a href="/someone/">someone</a><button>Follow</button></li>
          </ul>
        </div>
        <div>
          <a role="tab" href="/natgeo/" data-name="profile Posts tab" data-expect-profile="visible">Posts</a>
          <a role="tab" href="/natgeo/reels/" data-name="profile Reels tab" data-expect-profile="hidden" data-expect-modereelsprofile="hidden">Reels</a>
          <a role="tab" href="/natgeo/tagged/" data-name="profile Tagged tab" data-expect-profile="visible">Tagged</a>
        </div>
        <a href="/p/GRIDPOST111/" data-name="profile grid post" data-expect-profile="visible" data-expect-search="hidden" data-expect-modereelsprofile="visible" data-expect-modereelsexplore="visible">Grid post</a>
        <a href="/reel/GRIDREEL111/" data-name="profile or Explore grid reel" data-expect-modereelsprofile="hidden" data-expect-modereelsexplore="hidden">Grid reel</a>

        <!-- Search page: account results stay, any post grid goes -->
        <a href="/natgeo/" data-name="account search result" data-expect-search="visible">natgeo</a>
        <a href="/explore/people/" data-name="See all suggested link" data-expect-search="hidden" data-expect-profile="hidden">See all</a>

        <!-- DM thread -->
        <section>
          <div data-name="DM text message" data-expect-direct="visible" data-expect-modereelsdirect="visible">See you at 6</div>
          <div role="button" data-name="DM reel card (outer row)" data-expect-direct="visible">
            <div role="button" data-name="DM reel card" data-expect-direct="blurred" data-expect-modereelsdirect="blurred">
              <svg aria-label="Clip" width="10" height="10"></svg><span>Shared reel</span>
            </div>
          </div>
          <a href="/reel/DMREEL11111/" data-name="DM reel link" data-expect-direct="blurred">reel link</a>
          <a href="/p/DMPOST11111/" data-name="DM post link" data-expect-direct="visible">post link</a>
        </section>
      </main>
    </div>

    <template id="dynamic">
      <a href="/reels/" data-name="Reels link rendered later" data-expect-dynamic="hidden">Reels</a>
      <a href="/direct/inbox/" data-name="Messages link rendered later" data-expect-dynamic="visible">Messages</a>
    </template>
  </body>
</html>
