<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Popup (extension/popup)</title>
    <link rel="stylesheet" href="../../extension/popup/popup.css" />
  </head>
  <body>
    <script>
      // Loads the real popup markup and scripts against an in-memory
      // chrome.storage, clicks through it, and checks what it shows and saves.
      // The 30-second wait is cut to 2 seconds to keep the run short.
      (async function () {
        'use strict';
        const results = [];
        const check = (name, pass, detail) => results.push({ name, pass: Boolean(pass), detail: detail || '' });
        const wait = (ms) => new Promise((resolve) => setTimeout(resolve, ms));

        const stores = {
          sync: { settings: { youtube: true, instagram: true, facebook: true, tiktok: true } },
          // Left behind by the retired pause flow: it must all be ignored and tidied away.
          local: {
            pending: { youtube: { kind: 'off', at: Date.now() }, tiktok: { kind: 'pause', at: Date.now() } },
            unlocks: { instagram: Date.now() + 10 * 60 * 1000 },
            pauseLog: { date: '2000-01-01', used: { instagram: 2 } },
            pendingOff: { facebook: Date.now() },
          },
        };
        const listeners = [];
        const opened = []; // Pages the popup asked the browser to open.
        const copy = (value) => (value === undefined ? undefined : JSON.parse(JSON.stringify(value)));
        const area = (name) => ({
          get(keys) {
            const out = {};
            for (const key of [].concat(keys)) if (key in stores[name]) out[key] = copy(stores[name][key]);
            return Promise.resolve(out);
          },
          set(items) {
            const changes = {};
            for (const [key, value] of Object.entries(items)) {
              changes[key] = { oldValue: copy(stores[name][key]), newValue: copy(value) };
              stores[name][key] = copy(value);
            }
            setTimeout(() => listeners.forEach((listener) => listener(changes, name)), 0);
            return Promise.resolve();
          },
          remove(keys) {
            for (const key of [].concat(keys)) delete stores[name][key];
            return Promise.resolve();
          },
        });
        window.chrome = {
          storage: { sync: area('sync'), local: area('local'), onChanged: { addListener: (fn) => listeners.push(fn) } },
          runtime: {},
          commands: { getAll: () => Promise.resolve([{ name: 'start-focus-session', shortcut: 'Alt+Shift+F' }]) },
          tabs: { create: (options) => (opened.push(options.url), Promise.resolve({})) },
        };

        try {
          const request = new XMLHttpRequest();
          request.open('GET', '../../extension/popup/popup.html', false);
          request.send();
          const markup = new DOMParser().parseFromString(request.responseText, 'text/html');
          for (const node of Array.from(markup.body.children)) {
            if (node.tagName !== 'SCRIPT') document.body.append(document.importNode(node, true));
          }
          const load = (src) =>
            new Promise((resolve, reject) => {
              const script = document.createElement('script');
              script.src = src;
              script.onload = resolve;
              script.onerror = () => reject(new Error(`could not load ${src}`));
              document.head.append(script);
            });
          await load('../../extension/shared/stats.js');
          await load('../../extension/shared/pause.js');
          await load('../../extension/shared/schedule.js');
          await load('../../extension/shared/allowlist.js');
          try { localStorage.removeItem('shortstop.openSites'); } catch (error) {}
          globalThis.ShortStopPause.OFF_WAIT_SECONDS = 2;
          globalThis.ShortStopPause.OFF_WINDOW_SECONDS = 5;
          await load('../../extension/popup/popup.js');
          await wait(300);

          const $ = (selector) => document.querySelector(selector);
          const toggle = (platform) => $(`#toggle-${platform}`);
          const panel = (platform) => $(`.unlock[data-platform="${platform}"]`);
          const status = (platform) => panel(platform).querySelector('.unlock-status').textContent;
          const action = (platform, name) => panel(platform).querySelector(`[data-action="${name}"]`);
          const shown = (node) => Boolean(node) && node.checkVisibility();
          const visibleActions = (platform) =>
            Array.from(panel(platform).querySelectorAll('button'))
              .filter(shown)
              .map((node) => node.dataset.action)
              .join(',');
          const scheduler = (platform) => $(`.schedule[data-platform="${platform}"]`);
          const inScheduler = (platform, selector) => scheduler(platform).querySelector(selector);
          const pendingOf = (platform) => (stores.local.pending || {})[platform];
          const schedulesOf = (platform) => ((stores.sync.settings.schedules || {})[platform]);
          const step = () => wait(80);

          const ALL = ['youtube', 'instagram', 'facebook', 'tiktok', 'reddit', 'x', 'snapchat'];
          check('all seven switches start on', ALL.every((platform) => toggle(platform).checked));

          /* ---- Left over from the retired pause flow ---- */
          check(
            'its stored pauses and waits are removed',
            !('unlocks' in stores.local) && !('pauseLog' in stores.local) && !('pendingOff' in stores.local),
            JSON.stringify(Object.keys(stores.local))
          );
          check('its countdowns are dropped', !pendingOf('youtube') && !pendingOf('tiktok'), JSON.stringify(stores.local.pending));
          check('an old pause does not show a switch as off', toggle('instagram').checked && !shown(panel('instagram')));
          check('no card is showing', ALL.every((platform) => !shown(panel(platform))));

          /* ---- Every switch turns off in one click ---- */
          for (const platform of ALL) {
            toggle(platform).click();
            await step();
            check(
              `${platform}: one click switches blocking off, with no choice or countdown`,
              stores.sync.settings[platform] === false && !toggle(platform).checked && !shown(panel(platform)) && !pendingOf(platform),
              `${JSON.stringify(stores.sync.settings[platform])} ${status(platform)}`
            );
            toggle(platform).click();
            await step();
            check(`${platform}: one click switches it back on`, stores.sync.settings[platform] === true && toggle(platform).checked);
          }
          check('switching off stores no pause', !('unlocks' in stores.local) && !('pauseLog' in stores.local));
          check('the old pause buttons are gone', !document.querySelector('[data-action="allow"], [data-action="request"]'));

          /* ---- Each site's options fold away ---- */
          const expand = (platform) => $(`[aria-controls="details-${platform}"]`);
          const details = (platform) => $(`#details-${platform}`);
          const openSites = () => JSON.parse(localStorage.getItem('shortstop.openSites') || '[]');
          check(
            'every site starts folded',
            ALL.every((platform) => expand(platform).getAttribute('aria-expanded') === 'false' && !shown(details(platform)))
          );
          check('the switches stay visible while folded', ALL.every((platform) => shown(toggle(platform))));
          expand('youtube').click();
          await step();
          check(
            "clicking a site's name unfolds its options",
            expand('youtube').getAttribute('aria-expanded') === 'true' && shown(details('youtube')) && shown($('[role="radiogroup"]'))
          );
          check("clicking a site's name leaves its switch alone", toggle('youtube').checked && stores.sync.settings.youtube === true);
          check('only that site unfolds', ALL.filter((platform) => platform !== 'youtube').every((platform) => !shown(details(platform))));
          check('the popup remembers which sites are open', JSON.stringify(openSites()) === '["youtube"]', JSON.stringify(openSites()));
          expand('tiktok').click();
          await step();
          expand('tiktok').click();
          await step();
          check(
            'clicking again folds it back',
            expand('tiktok').getAttribute('aria-expanded') === 'false' && !shown(details('tiktok')) &&
              JSON.stringify(openSites()) === '["youtube"]',
            JSON.stringify(openSites())
          );
          check('the switches name their site for screen readers', toggle('x').getAttribute('aria-label') === 'Block X');

          /* ---- YouTube: what to block ---- */
          const choice = (value) => $(`input[name="youtube-mode"][value="${value}"]`);
          const youtubeDetail = () => $('#detail-youtube').textContent;
          check('YouTube offers three choices', ['all', 'feeds', 'shorts'].every((value) => choice(value)));
          check('YouTube blocks feeds and Shorts by default', choice('feeds').checked && !choice('all').checked && !choice('shorts').checked);
          check('the YouTube row says what is blocked', youtubeDetail() === 'Home feed, Up next and Shorts off', youtubeDetail());
          check(
            'the choices are labelled for screen readers',
            $('[role="radiogroup"]').getAttribute('aria-labelledby') === 'youtube-mode-label' &&
              $('#youtube-mode-label').textContent === 'While YouTube is on, choose what to block:'
          );
          choice('all').click();
          await step();
          check(
            'choosing "Block all of YouTube" saves only that choice',
            stores.sync.settings.youtubeMode === 'all' && stores.sync.settings.youtube === true && toggle('youtube').checked,
            JSON.stringify(stores.sync.settings)
          );
          check('the YouTube row follows the choice', youtubeDetail() === 'All of YouTube blocked', youtubeDetail());
          choice('shorts').click();
          await step();
          check('choosing "Block YouTube Shorts only" saves it', stores.sync.settings.youtubeMode === 'shorts');
          check('the YouTube row says only Shorts are off', youtubeDetail() === 'Shorts off', youtubeDetail());
          await chrome.storage.sync.set({ settings: { ...stores.sync.settings, youtube: false } });
          await step();
          check('the choices are greyed out while YouTube is off', ['all', 'feeds', 'shorts'].every((value) => choice(value).disabled));
          check('the choice is kept while YouTube is off', choice('shorts').checked && stores.sync.settings.youtubeMode === 'shorts');
          await chrome.storage.sync.set({ settings: { ...stores.sync.settings, youtube: true, youtubeMode: 'feeds' } });
          await step();
          check('the choices come back with YouTube', !choice('feeds').disabled && choice('feeds').checked);

          /* ---- Instagram and TikTok: what to block ---- */
          const pick = (platform, value) => $(`input[name="${platform}-mode"][value="${value}"]`);
          const detailOf = (platform) => $(`#detail-${platform}`).textContent;
          check('Instagram offers three choices', ['all', 'feeds', 'reels'].every((value) => pick('instagram', value)));
          check('TikTok offers two choices', ['all', 'feeds'].every((value) => pick('tiktok', value)) && !pick('tiktok', 'shorts'));
          check(
            'Instagram and TikTok block feeds by default',
            pick('instagram', 'feeds').checked && pick('tiktok', 'feeds').checked,
            `${detailOf('instagram')} / ${detailOf('tiktok')}`
          );
          check(
            'their choices sit in their folded options',
            details('instagram').contains(pick('instagram', 'reels')) && details('tiktok').contains(pick('tiktok', 'all'))
          );
          expand('instagram').click();
          expand('tiktok').click();
          await step();
          pick('instagram', 'reels').click();
          await step();
          check(
            'choosing "Block Reels only" saves only that choice',
            stores.sync.settings.instagramMode === 'reels' && stores.sync.settings.instagram === true && !('tiktokMode' in stores.sync.settings),
            JSON.stringify(stores.sync.settings)
          );
          check('the Instagram row says only Reels are off', detailOf('instagram') === 'Reels off', detailOf('instagram'));
          pick('instagram', 'all').click();
          await step();
          check('the Instagram row follows "Block all"', detailOf('instagram') === 'All of Instagram blocked', detailOf('instagram'));
          pick('tiktok', 'all').click();
          await step();
          check(
            'choosing "Block all of TikTok" saves it',
            stores.sync.settings.tiktokMode === 'all' && detailOf('tiktok') === 'All of TikTok blocked',
            detailOf('tiktok')
          );
          toggle('tiktok').click();
          await step();
          check('the TikTok choices are greyed out while TikTok is off', ['all', 'feeds'].every((value) => pick('tiktok', value).disabled));
          toggle('tiktok').click();
          await step();
          check('the TikTok choices come back with TikTok', !pick('tiktok', 'all').disabled && pick('tiktok', 'all').checked);
          pick('instagram', 'reels').click();
          pick('tiktok', 'feeds').click();
          await step();
          expand('instagram').click();
          expand('tiktok').click();
          await step();

          /* ---- Switching off leaves the other settings alone ---- */
          toggle('youtube').click();
          await step();
          check('YouTube off: its choice is untouched', stores.sync.settings.youtubeMode === 'feeds');
          toggle('youtube').click();
          await step();
          toggle('tiktok').click();
          await step();
          check('allowed times cannot be edited while a platform is off', inScheduler('tiktok', '.schedule-edit').disabled);
          toggle('tiktok').click();
          await step();

          /* ---- Allowed times ---- */
          const edit = () => inScheduler('youtube', '.schedule-edit');
          const summary = () => inScheduler('youtube', '.schedule-summary').textContent;
          check('allowed times: none to start with', summary() === 'None', summary());
          edit().click();
          await step();
          check('allowed times: Edit opens the editor', shown(inScheduler('youtube', '.schedule-editor')));
          check('allowed times: empty editor explains itself', shown(inScheduler('youtube', '.schedule-empty')));
          inScheduler('youtube', '[data-action="add-slot"]').click();
          await step();
          const days = () => Array.from(scheduler('youtube').querySelectorAll('.day'));
          const times = () => Array.from(scheduler('youtube').querySelectorAll('.time'));
          check('allowed times: a new time is every day', days().length === 7 && days().every((box) => box.checked));
          check('allowed times: a new time is 20:00 to 21:00', times()[0].value === '20:00' && times()[1].value === '21:00', times().map((t) => t.value).join(' '));
          check('allowed times: days are named for screen readers', days()[0].getAttribute('aria-label') === 'Monday', days()[0].getAttribute('aria-label'));
          inScheduler('youtube', '[data-action="save-schedule"]').click();
          await step();
          check('adding a time: not saved straight away', !schedulesOf('youtube'), JSON.stringify(schedulesOf('youtube')));
          check('adding a time: waits instead', pendingOf('youtube') && pendingOf('youtube').kind === 'schedule', JSON.stringify(pendingOf('youtube')));
          check('adding a time: counting down', /^Saving the new allowed times in \ds\.$/.test(status('youtube')), status('youtube'));
          check('adding a time: only Cancel while waiting', visibleActions('youtube') === 'cancel', visibleActions('youtube'));
          check('adding a time: the summary says a change is waiting', summary().endsWith('(a change is waiting)'), summary());
          check('adding a time: no more edits while it waits', edit().disabled);
          await wait(3200);
          check('adding a time: ready after the wait', status('youtube') === "Ready. Save YouTube's new allowed times?", status('youtube'));
          check('adding a time: confirm button', action('youtube', 'confirm').textContent === 'Save now');
          action('youtube', 'confirm').click();
          await step();
          check(
            'adding a time: saved to the synced settings',
            JSON.stringify(schedulesOf('youtube')) === JSON.stringify([{ days: [0, 1, 2, 3, 4, 5, 6], start: 1200, end: 1260 }]),
            JSON.stringify(schedulesOf('youtube'))
          );
          check('adding a time: the summary shows it', summary().startsWith('Every day, '), summary());

          edit().click();
          await step();
          times()[1].value = '20:30';
          times()[1].dispatchEvent(new Event('input'));
          inScheduler('youtube', '[data-action="save-schedule"]').click();
          await step();
          check('shortening a time: saved straight away', schedulesOf('youtube')[0].end === 1230 && !pendingOf('youtube'), JSON.stringify(schedulesOf('youtube')));

          edit().click();
          await step();
          for (const box of days()) box.click();
          inScheduler('youtube', '[data-action="save-schedule"]').click();
          await step();
          check('a time with no days: explains the problem', inScheduler('youtube', '.schedule-error').textContent === 'Choose at least one day for each time.');
          check('a time with no days: nothing is saved', schedulesOf('youtube')[0].days.length === 7);
          inScheduler('youtube', '[data-action="cancel-schedule"]').click();
          await step();
          check('Cancel closes the editor', !shown(inScheduler('youtube', '.schedule-editor')));

          edit().click();
          await step();
          inScheduler('youtube', '[data-action="remove-slot"]').click();
          await step();
          inScheduler('youtube', '[data-action="save-schedule"]').click();
          await step();
          check('removing a time: saved straight away', schedulesOf('youtube').length === 0 && !pendingOf('youtube'), JSON.stringify(schedulesOf('youtube')));
          check('removing a time: the summary says none', summary() === 'None', summary());

          /* ---- Inside an allowed time ---- */
          await chrome.storage.sync.set({
            settings: { ...stores.sync.settings, schedules: { youtube: [{ days: [0, 1, 2, 3, 4, 5, 6], start: 0, end: 0 }] } },
          });
          await wait(1100);
          check('allowed now: the switch shows off', !toggle('youtube').checked);
          check('allowed now: every day, all day reads as all week', status('youtube') === 'Allowed by your schedule all week.', status('youtube'));
          check('allowed now: offers "Block now"', action('youtube', 'block').textContent === 'Block now' && shown(action('youtube', 'block')));
          action('youtube', 'block').click();
          await step();
          const skip = Number((stores.local.scheduleSkips || {}).youtube);
          check(
            '"Block now" on an all-week schedule blocks until midnight',
            skip > Date.now() && skip - Date.now() <= 24 * 60 * 60 * 1000 && new Date(skip).getHours() === 0,
            new Date(skip).toString()
          );
          check('"Block now" turns the switch back on', toggle('youtube').checked && !shown(panel('youtube')));
          /* ---- Allowed accounts ---- */
          const allowBox = (platform) => $(`.allow[data-platform="${platform}"]`);
          check(
            'allowed accounts: offered for YouTube, Instagram, TikTok and Snapchat only',
            ['youtube', 'instagram', 'tiktok', 'snapchat'].every((platform) => allowBox(platform)) &&
              ['facebook', 'reddit', 'x'].every((platform) => !allowBox(platform))
          );
          check(
            'allowed accounts: YouTube lists channels, the others accounts',
            allowBox('youtube').querySelector('.schedule-title').textContent === 'Allowed channels' &&
              allowBox('tiktok').querySelector('.schedule-title').textContent === 'Allowed accounts'
          );
          const allowInput = allowBox('youtube').querySelector('.allow-input');
          const allowError = allowBox('youtube').querySelector('.schedule-error');
          const addAccount = async (value) => {
            allowInput.value = value;
            allowBox('youtube').querySelector('.allow-form').requestSubmit();
            await step();
          };
          await chrome.storage.local.set({ pending: {} });
          await step();
          check('allowed accounts: none to start with', allowBox('youtube').querySelector('.schedule-summary').textContent === 'None');
          await addAccount('not a channel!');
          check(
            'allowed accounts: something that is not a channel is refused',
            /doesn't look like a YouTube channel/.test(allowError.textContent) && !pendingOf('youtube'),
            allowError.textContent
          );
          await addAccount('https://www.youtube.com/@Veritasium/videos');
          check(
            'allowed accounts: a pasted link is read as the channel, and waits',
            pendingOf('youtube') && pendingOf('youtube').kind === 'allow' && pendingOf('youtube').name === 'veritasium' && !allowError.textContent,
            JSON.stringify(pendingOf('youtube'))
          );
          check('allowed accounts: nothing is allowed before the wait', !(stores.sync.settings.youtubeAllowed || []).length);
          check('allowed accounts: the card counts down', /^Allowing @veritasium in \ds\.$/.test(status('youtube')), status('youtube'));
          check('allowed accounts: the field is locked while it waits', allowInput.disabled);
          check(
            'allowed accounts: the list says one is waiting',
            allowBox('youtube').querySelector('.schedule-summary').textContent === 'None. Adding @veritasium (waiting).',
            allowBox('youtube').querySelector('.schedule-summary').textContent
          );
          await wait(3300); // The popup refreshes its countdown once a second.
          check('allowed accounts: after the wait it asks', status('youtube') === 'Ready. Allow @veritasium on YouTube?', status('youtube'));
          action('youtube', 'confirm').click();
          await step();
          check(
            'allowed accounts: Save now allows it',
            JSON.stringify(stores.sync.settings.youtubeAllowed) === '["veritasium"]' && !pendingOf('youtube'),
            JSON.stringify(stores.sync.settings.youtubeAllowed)
          );
          check(
            'allowed accounts: it shows in the list, with a remove button',
            allowBox('youtube').querySelector('.allow-item').textContent.includes('@veritasium') &&
              allowBox('youtube').querySelector('.allow-remove').getAttribute('aria-label') === 'Remove @veritasium'
          );
          await addAccount('@VERITASIUM');
          check('allowed accounts: the same channel twice is refused', /already allowed/.test(allowError.textContent) && !pendingOf('youtube'), allowError.textContent);
          await addAccount('@3blue1brown');
          action('youtube', 'cancel').click();
          await step();
          check('allowed accounts: Cancel drops a waiting one', !pendingOf('youtube') && JSON.stringify(stores.sync.settings.youtubeAllowed) === '["veritasium"]');
          allowBox('youtube').querySelector('.allow-remove').click();
          await step();
          check(
            'allowed accounts: removing is instant',
            JSON.stringify(stores.sync.settings.youtubeAllowed) === '[]' && !allowBox('youtube').querySelector('.allow-item')
          );
          await chrome.storage.sync.set({ settings: { ...stores.sync.settings, youtubeAllowed: ['veritasium'] } });
          await step();

          /* ---- Focus session ---- */
          await chrome.storage.sync.set({
            settings: { ...stores.sync.settings, schedules: {}, youtube: false, youtubeMode: 'shorts' },
          });
          await wait(1100);
          const focusText = () => $('#focus-text').textContent;
          const focusBox = $('#focus');
          check('focus: offers 30 min, 1 hour and 2 hours', shown($('#focus-choices')) && !shown($('#focus-confirm')));
          check(
            'focus: shows the keyboard shortcut',
            shown($('#focus-hint')) && $('#focus-hint').textContent === 'Or press Alt+Shift+F twice for 1 hour.',
            $('#focus-hint').textContent
          );

          /* ---- The keyboard shortcut: switch it off, or change the key in the browser ---- */
          const shortcutSwitch = $('#option-focus-shortcut');
          const shortcutLink = $('#focus-shortcut-link');
          check('shortcut: the switch is shown, on by default', shown(shortcutSwitch) && shortcutSwitch.checked);
          check('shortcut: the switch is named after the key', shortcutSwitch.getAttribute('aria-label') === 'Keyboard shortcut Alt+Shift+F');
          check(
            'shortcut: offers to change or remove the key in the browser',
            shown(shortcutLink) && shortcutLink.textContent === 'Change or remove the key',
            shortcutLink.textContent
          );
          shortcutSwitch.click();
          await step();
          check('shortcut: switching it off is saved', stores.sync.settings.focusShortcut === false, JSON.stringify(stores.sync.settings.focusShortcut));
          check(
            'shortcut: the line says it is off',
            !shortcutSwitch.checked && $('#focus-hint').textContent === 'The Alt+Shift+F shortcut is off.',
            $('#focus-hint').textContent
          );
          check('shortcut: the focus buttons still work while it is off', shown($('#focus-choices')));
          shortcutSwitch.click();
          await step();
          check(
            'shortcut: switching it back on is saved',
            stores.sync.settings.focusShortcut === true && shortcutSwitch.checked && $('#focus-hint').textContent === 'Or press Alt+Shift+F twice for 1 hour.',
            $('#focus-hint').textContent
          );
          shortcutLink.click();
          await step();
          check(
            'shortcut: the link opens the browser shortcut settings',
            opened.length === 1 && /^(chrome|edge|brave):\/\/extensions\/shortcuts$/.test(opened[0]),
            JSON.stringify(opened)
          );
          const line = (extra) => globalThis.describeShortcut({ known: true, key: 'Alt+Shift+F', enabled: true, hasSettingsPage: true, ...extra });
          check('shortcut: nothing shows until the browser has answered', globalThis.describeShortcut({ known: false, key: '', enabled: true, hasSettingsPage: true }).hidden === true);
          check(
            'shortcut: no key set says so and offers to set one',
            line({ key: '' }).text === 'No keyboard shortcut is set.' && !line({ key: '' }).showSwitch && line({ key: '' }).link === 'Set a key',
            JSON.stringify(line({ key: '' }))
          );
          check(
            'shortcut: Firefox gets instructions instead of a link',
            /Manage Extension Shortcuts/.test(line({ key: '', hasSettingsPage: false }).text) && line({ key: '', hasSettingsPage: false }).link === '' && line({ hasSettingsPage: false }).link === '',
            JSON.stringify(line({ key: '', hasSettingsPage: false }))
          );
          check('shortcut: a custom key is named as the browser reports it', line({ key: 'Ctrl+Shift+K' }).text === 'Or press Ctrl+Shift+K twice for 1 hour.');

          $('[data-focus-minutes="60"]').click();
          await step();
          check('focus: picking a length asks first', shown($('#focus-confirm')) && !shown($('#focus-choices')) && focusText().includes('for 1 hour'), focusText());
          check('focus: nothing starts before Start', !stores.sync.settings.focusUntil);
          check('focus: no shortcut hint while confirming', !shown($('#focus-hint')));
          $('#focus-cancel').click();
          await step();
          check('focus: Cancel goes back to the choices', shown($('#focus-choices')) && !stores.sync.settings.focusUntil);
          $('[data-focus-minutes="60"]').click();
          await step();
          const startedAt = Date.now();
          $('#focus-start').click();
          await step();
          const until = Number(stores.sync.settings.focusUntil);
          check('focus: Start saves when it ends', Math.abs(until - (startedAt + 60 * 60 * 1000)) < 5000, String(until - startedAt));
          check('focus: counting down', focusBox.classList.contains('is-active') && /^(1:00:00|59:\d\d) left\./.test(focusText()), focusText());
          check('focus: no choices while it runs', !shown($('#focus-choices')) && !shown($('#focus-confirm')) && !shown($('#focus-hint')));
          check('focus: every switch shows on and is locked', ALL.every((platform) => toggle(platform).checked && toggle(platform).disabled));
          toggle('instagram').click();
          await step();
          check('focus: clicking a locked switch changes nothing', stores.sync.settings.instagram === true && toggle('instagram').checked);
          check(
            'focus: YouTube shows "feeds and Shorts" (raised from Shorts only) and is locked',
            choice('feeds').checked && ['all', 'feeds', 'shorts'].every((value) => choice(value).disabled) &&
              stores.sync.settings.youtubeMode === 'shorts'
          );
          check(
            'focus: Instagram shows "feeds and Reels" (raised from Reels only) and is locked',
            pick('instagram', 'feeds').checked && pick('instagram', 'reels').disabled &&
              detailOf('instagram') === 'Feed, Explore, Reels and Stories off' && stores.sync.settings.instagramMode === 'reels',
            detailOf('instagram')
          );
          check('focus: allowed times cannot be edited', ALL.every((platform) => inScheduler(platform, '.schedule-edit').disabled));
          check('focus: allowed accounts cannot be added', allowBox('youtube').querySelector('.allow-input').disabled);
          check(
            'focus: the list says it is ignored',
            allowBox('youtube').querySelector('.schedule-summary').textContent === 'Ignored during the focus session.',
            allowBox('youtube').querySelector('.schedule-summary').textContent
          );
          check('focus: other options still work', !$('#option-instagram-notifications').disabled);
          check('focus: YouTube keeps its own setting underneath', stores.sync.settings.youtube === false);

          await chrome.storage.sync.set({ settings: { ...stores.sync.settings, focusUntil: Date.now() + 1500 } });
          await wait(2600);
          check('focus: when it ends, the switches unlock by themselves', ALL.every((platform) => !toggle(platform).disabled));
          check('focus: YouTube is back to its own setting (off)', !toggle('youtube').checked);
          check('focus: YouTube is back to its own choice (Shorts only), greyed out as YouTube is off', choice('shorts').checked && choice('shorts').disabled);
          check('focus: Instagram is back to its own choice (Reels only)', pick('instagram', 'reels').checked && detailOf('instagram') === 'Reels off');
          check('focus: the choices come back', shown($('#focus-choices')) && !focusBox.classList.contains('is-active'));
        } catch (error) {
          check('popup test crashed', false, String(error && error.stack));
        }

        const output = document.createElement('pre');
        output.id = 'results';
        output.textContent = JSON.stringify(results);
        document.documentElement.appendChild(output);
      })();
    </script>
  </body>
</html>
