<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ShortStop</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header class="brand">
      <!-- Landscape rounded rectangle with a right-facing play symbol. -->
      <svg class="brand-mark" viewBox="0 0 28 20" width="28" height="20" aria-hidden="true" focusable="false">
        <rect width="28" height="20" rx="6" fill="currentColor" />
        <path d="M11.5 6.2v7.6L18 10z" fill="#fff" />
      </svg>
      <span class="brand-name">ShortStop</span>
    </header>

    <section class="tally" aria-labelledby="tally-label">
      <p class="tally-number" id="today-total" aria-live="polite">0</p>
      <p class="tally-label" id="tally-label">blocked today</p>
    </section>

    <!-- Focus session: blocks every site and locks the switches until it ends. -->
    <section class="focus" id="focus" aria-labelledby="focus-title">
      <h2 class="focus-title" id="focus-title">Focus session</h2>
      <p class="focus-text" id="focus-text" aria-live="polite">Block every site and lock the switches for a while.</p>
      <div class="focus-actions" id="focus-choices">
        <button type="button" class="btn btn-plain" data-focus-minutes="30">30 min</button>
        <button type="button" class="btn btn-plain" data-focus-minutes="60">1 hour</button>
        <button type="button" class="btn btn-plain" data-focus-minutes="120">2 hours</button>
      </div>
      <div class="focus-actions" id="focus-confirm" hidden>
        <button type="button" class="btn btn-primary" id="focus-start">Start</button>
        <button type="button" class="btn btn-quiet" id="focus-cancel">Cancel</button>
      </div>
      <!-- The keyboard shortcut: what it does, a switch to turn it off, and a way to change or remove the key. -->
      <div class="focus-shortcut" id="focus-shortcut" hidden>
        <div class="focus-shortcut-row">
          <p class="focus-hint" id="focus-hint"></p>
          <input
            class="switch switch-small"
            type="checkbox"
            role="switch"
            id="option-focus-shortcut"
            data-setting="focusShortcut"
            data-default="true"
          />
        </div>
        <a class="focus-link" id="focus-shortcut-link" href="#" hidden></a>
      </div>
    </section>

    <!-- One row per platform. The switch saves instantly; open tabs update live. -->
    <ul class="platforms">
      <li class="platform">
        <label class="platform-row" for="toggle-youtube">
          <span class="platform-text">
            <span class="platform-name">YouTube</span>
            <span class="platform-detail" id="detail-youtube">Home feed, Up next and Shorts off</span>
          </span>
          <span class="platform-count" id="count-youtube" title="Blocked today">0</span>
          <input class="switch" type="checkbox" role="switch" id="toggle-youtube" data-platform="youtube" checked />
        </label>
        <div class="choices" role="radiogroup" aria-labelledby="youtube-mode-label" data-default="feeds">
          <p class="choices-legend" id="youtube-mode-label">While YouTube is on, choose what to block:</p>
        <label class="choice">
          <input type="radio" name="youtube-mode" value="all" data-setting="youtubeMode" data-parent="youtube" />
          <span class="option-text">
            <span class="option-title">Block all of YouTube</span>
            <span class="option-detail">Every YouTube page, including videos, search, subscriptions and Shorts.</span>
          </span>
        </label>
        <label class="choice">
          <input type="radio" name="youtube-mode" value="feeds" data-setting="youtubeMode" data-parent="youtube" />
          <span class="option-text">
            <span class="option-title">Block feeds and Shorts</span>
            <span class="option-detail">The home feed, Trending, Up next, autoplay and Shorts. Search, subscriptions and videos you open still work.</span>
          </span>
        </label>
        <label class="choice">
          <input type="radio" name="youtube-mode" value="shorts" data-setting="youtubeMode" data-parent="youtube" />
          <span class="option-text">
            <span class="option-title">Block YouTube Shorts only</span>
            <span class="option-detail">Keep normal YouTube fully usable, but remove Shorts and other <span class="nowrap">short-form</span> content throughout YouTube.</span>
          </span>
        </label>
        </div>
      </li>
      <li class="platform">
        <label class="platform-row" for="toggle-instagram">
          <span class="platform-text">
            <span class="platform-name">Instagram</span>
            <span class="platform-detail">Feed, Explore, Reels and Stories off</span>
          </span>
          <span class="platform-count" id="count-instagram" title="Blocked today">0</span>
          <input class="switch" type="checkbox" role="switch" id="toggle-instagram" data-platform="instagram" checked />
        </label>
        <label class="option-row" for="option-instagram-notifications">
          <span>Allow notifications</span>
          <input
            class="switch switch-small"
            type="checkbox"
            role="switch"
            id="option-instagram-notifications"
            data-setting="instagramNotifications"
            data-parent="instagram"
          />
        </label>
      </li>
      <li class="platform">
        <label class="platform-row" for="toggle-facebook">
          <span class="platform-text">
            <span class="platform-name">Facebook</span>
            <span class="platform-detail">News Feed, Reels and Watch off</span>
          </span>
          <span class="platform-count" id="count-facebook" title="Blocked today">0</span>
          <input class="switch" type="checkbox" role="switch" id="toggle-facebook" data-platform="facebook" checked />
        </label>
        <label class="option-row" for="option-facebook-marketplace">
          <span>Allow Marketplace search</span>
          <input
            class="switch switch-small"
            type="checkbox"
            role="switch"
            id="option-facebook-marketplace"
            data-setting="facebookMarketplaceSearch"
            data-parent="facebook"
            data-default="true"
          />
        </label>
        <label class="option-row" for="option-facebook-notifications">
          <span>Allow notifications</span>
          <input
            class="switch switch-small"
            type="checkbox"
            role="switch"
            id="option-facebook-notifications"
            data-setting="facebookNotifications"
            data-parent="facebook"
          />
        </label>
      </li>
      <li class="platform">
        <label class="platform-row" for="toggle-tiktok">
          <span class="platform-text">
            <span class="platform-name">TikTok</span>
            <span class="platform-detail">All feeds and LIVE off</span>
          </span>
          <span class="platform-count" id="count-tiktok" title="Blocked today">0</span>
          <input class="switch" type="checkbox" role="switch" id="toggle-tiktok" data-platform="tiktok" checked />
        </label>
        <label class="option-row" for="option-tiktok-notifications">
          <span>Allow notifications</span>
          <input
            class="switch switch-small"
            type="checkbox"
            role="switch"
            id="option-tiktok-notifications"
            data-setting="tiktokNotifications"
            data-parent="tiktok"
          />
        </label>
      </li>
      <li class="platform">
        <label class="platform-row" for="toggle-reddit">
          <span class="platform-text">
            <span class="platform-name">Reddit</span>
            <span class="platform-detail">Home, Popular and All off</span>
          </span>
          <span class="platform-count" id="count-reddit" title="Blocked today">0</span>
          <input class="switch" type="checkbox" role="switch" id="toggle-reddit" data-platform="reddit" checked />
        </label>
      </li>
      <li class="platform">
        <label class="platform-row" for="toggle-x">
          <span class="platform-text">
            <span class="platform-name">X</span>
            <span class="platform-detail">Home timeline and Explore off</span>
          </span>
          <span class="platform-count" id="count-x" title="Blocked today">0</span>
          <input class="switch" type="checkbox" role="switch" id="toggle-x" data-platform="x" checked />
        </label>
        <label class="option-row" for="option-x-notifications">
          <span>Allow notifications</span>
          <input
            class="switch switch-small"
            type="checkbox"
            role="switch"
            id="option-x-notifications"
            data-setting="xNotifications"
            data-parent="x"
          />
        </label>
      </li>
      <li class="platform">
        <label class="platform-row" for="toggle-snapchat">
          <span class="platform-text">
            <span class="platform-name">Snapchat</span>
            <span class="platform-detail">Spotlight and Discover off</span>
          </span>
          <span class="platform-count" id="count-snapchat" title="Blocked today">0</span>
          <input class="switch" type="checkbox" role="switch" id="toggle-snapchat" data-platform="snapchat" checked />
        </label>
      </li>
    </ul>

    <footer class="footer">
      <p id="status" class="status" role="status"></p>
      <p id="all-time">0 blocked since you installed ShortStop</p>
      <p>Nothing is collected or sent anywhere.</p>
      <p><a href="../welcome/welcome.html" target="_blank" rel="noopener">How ShortStop works</a></p>
    </footer>

    <script src="../shared/stats.js"></script>
    <script src="../shared/pause.js"></script>
    <script src="../shared/schedule.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
