<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>TikTok blocked by ShortStop</title>
    <link rel="icon" href="../icons/icon32.png" />
    <link rel="stylesheet" href="blocked.css" />
  </head>
  <body>
    <main class="sign">
      <!-- The ShortStop mark: a stop octagon around a vertical video frame. -->
      <svg class="mark" viewBox="0 0 100 100" aria-hidden="true">
        <polygon points="29.3,0 70.7,0 100,29.3 100,70.7 70.7,100 29.3,100 0,70.7 0,29.3" fill="#d62839" />
        <rect x="34" y="22" width="32" height="56" rx="7" fill="#fff" />
        <polygon points="44,39 60,50 44,61" fill="#d62839" />
      </svg>

      <h1>TikTok is blocked</h1>
      <p class="lede">
        ShortStop blocks TikTok completely, because the whole site is a feed of short videos.
      </p>
      <p class="count" id="count" hidden></p>

      <div class="actions">
        <button type="button" id="back" class="button">Go back</button>
      </div>

      <p class="hint">
        Need TikTok for something specific? Switch it off in the ShortStop menu in your
        toolbar and this tab will open TikTok straight away.
      </p>
    </main>

    <script src="../shared/stats.js"></script>
    <script src="blocked.js"></script>
  </body>
</html>
