name: CodeQL

# GitHub's code scanning: security problems in the extension's JavaScript (such as
# injection or unsafe DOM use) and in these workflow files. Results appear in the
# repository's Security tab and on pull requests.
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '23 4 * * 1' # Mondays, to catch problems found by newer CodeQL rules.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: CodeQL (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write # Uploading the results.
    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript, actions]
    steps:
      - uses: actions/checkout@v4

      - name: Set up CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          build-mode: none # Plain JavaScript and YAML: nothing to build.
          config-file: ./.github/codeql/codeql-config.yml

      - name: Analyze
        uses: github/codeql-action/analyze@v3
        with:
          category: /language:${{ matrix.language }}
